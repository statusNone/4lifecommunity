{{define "header"}}
<header class="site-header">
  <div class="header-border"></div>
  <div class="header-inner">
    <a class="brand" href="/" aria-label="4Life home">
      <img src="{{.Settings.logo}}" alt="{{.Settings.logo_alt}}">
    </a>
    <nav class="desktop-nav" aria-label="Primary">
      {{range .Nav}}
      <div class="nav-folder">
        <a class="nav-folder-toggle" href="#">{{.Label}}</a>
        <div class="nav-dropdown">
          {{range .Items}}
            {{if .External}}
            <a href="{{.Href}}" target="_blank" rel="noopener">{{.Label}}</a>
            {{else}}
            <a href="{{.Href}}">{{.Label}}</a>
            {{end}}
          {{end}}
        </div>
      </div>
      {{end}}
    </nav>
    <div class="header-actions">
      <a class="social-icon" href="{{.Settings.instagram}}" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="social-icon" href="{{.Settings.youtube}}" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.3 5 12 5 12 5s-7.3 0-8.8.5a2.5 2.5 0 0 0-1.8 1.8C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.7 19 12 19 12 19s7.3 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.1V8.9L15.5 12l-5.7 3.1z"/></svg>
      </a>
      <button class="burger" aria-label="Menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<nav class="mobile-nav" aria-label="Mobile">
  {{range .Nav}}
  <details class="mobile-folder">
    <summary>{{.Label}}</summary>
    {{range .Items}}
      {{if .External}}
      <a href="{{.Href}}" target="_blank" rel="noopener">{{.Label}}</a>
      {{else}}
      <a href="{{.Href}}">{{.Label}}</a>
      {{end}}
    {{end}}
  </details>
  {{end}}
  <div class="mobile-socials">
    <a class="social-icon" href="{{.Settings.instagram}}" target="_blank" rel="noopener">Instagram</a>
    <a class="social-icon" href="{{.Settings.youtube}}" target="_blank" rel="noopener">YouTube</a>
  </div>
</nav>
{{end}}
