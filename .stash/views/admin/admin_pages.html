{{define "admin_pages.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
{{template "admin_sidebar" .}}
<header class="admin-page-head">
  <h1>Pages</h1>
</header>

{{range .Pages}}
<section class="admin-panel">
  <h2>{{.Page.Title}} <a class="link" href="/{{.Page.Slug}}" target="_blank">&nearr;</a></h2>
  <form method="post" action="/admin/pages/save" class="admin-form">
    <input type="hidden" name="slug" value="{{.Page.Slug}}">
    <div class="form-row">
      <div class="field">
        <label>Meta description</label>
        <textarea name="meta_description" rows="2">{{.Page.MetaDescription}}</textarea>
      </div>
    </div>
    <details class="admin-collapse">
      <summary>Hero</summary>
      <div class="form-row">
        <div class="field">
          <label>Hero label</label>
          <input name="hero_label" type="text" value="{{.Page.HeroLabel}}">
        </div>
        <div class="field">
          <label>Hero headline <small>(markdown)</small></label>
          <input name="hero_headline" type="text" value="{{.Page.HeroHeadline}}">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Hero body <small>(markdown)</small></label>
          <textarea name="hero_body" rows="2">{{.Page.HeroBody}}</textarea>
        </div>
        <div class="field">
          <label>Hero image URL</label>
          <input name="hero_image" type="text" value="{{.Page.HeroImage}}">
          <label>Hero image alt</label>
          <input name="hero_image_alt" type="text" value="{{.Page.HeroImageAlt}}">
        </div>
      </div>
      <label class="checkbox"><input type="checkbox" name="published" {{if .Page.Published}}checked{{end}}> Page published</label>
    </details>
    <details class="admin-collapse" open>
      <summary>Sections</summary>
      {{range .Sections}}
      <fieldset class="section-block">
        <legend>{{.Kind}} section</legend>
        <div class="form-row">
          <div class="field">
            <label>Headline <small>(markdown)</small></label>
            <input name="section_headline_{{.ID}}" type="text" value="{{.Headline}}">
          </div>
          <div class="field">
            <label>Button label</label>
            <input name="section_button_label_{{.ID}}" type="text" value="{{.ButtonLabel}}">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Body <small>(markdown)</small></label>
            <textarea name="section_body_{{.ID}}" rows="3">{{.Body}}</textarea>
          </div>
          <div class="field">
            <label>Image URL</label>
            <input name="section_image_{{.ID}}" type="text" value="{{.Image}}">
            <label>Image alt</label>
            <input name="section_image_alt_{{.ID}}" type="text" value="{{.ImageAlt}}">
          </div>
        </div>
      </fieldset>
      {{end}}
    </details>
    <button type="submit" class="btn">Save Page</button>
  </form>
</section>
{{end}}
</main>
</body>
</html>{{end}}
